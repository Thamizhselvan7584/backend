<body>
    <script>
        let balance = 1000;
        let price = 300;

        if (balance >= price) {

            console.log("Purchase successful");
            console.log("Remaining balance:" + (balance - price));

        } else {
            console.log("Insufficient balance")
        }


        let balance_1 = 200;
        let price_1 = 300;

        if (balance_1 >= price_1) {

            console.log("Purchase successful");
            console.log("Remaining balance:" + (balance_1 - price_1));

        } else {
            console.log("Insufficient balance")
        }
    </script>
</body>
